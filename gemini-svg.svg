<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Deep Dark Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="50%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Vibrant Gradient Text & Accents -->
    <linearGradient id="vibrant-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#4facfe" />
      <stop offset="80%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>

    <linearGradient id="orange-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <!-- Glowing Background Orbs -->
    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-magenta" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#e100ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e100ff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="grid-pattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <!-- Text Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .main-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 58px; fill: url(#vibrant-grad); letter-spacing: -1px; }
      .main-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 24px; fill: #ffffff; letter-spacing: 0.5px; }
      .quote-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 18px; font-weight: 600; fill: #00f2fe; }
      .body-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #94a3b8; font-weight: 500; }
      .location-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; fill: #cbd5e1; font-weight: 600; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 800; fill: #64748b; letter-spacing: 2px; text-transform: uppercase; }
      .badge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background Base & Ambient Neon Glow -->
  <rect width="1280" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1280" height="420" fill="url(#grid-pattern)" rx="16" />
  <rect width="1280" height="420" fill="url(#glow-cyan)" rx="16" />
  <rect width="1280" height="420" fill="url(#glow-magenta)" rx="16" />

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="1280" height="5" fill="url(#vibrant-grad)" />

  <!-- LEFT COLUMN: Main Branding & Info -->
  <!-- Name -->
  <text x="90" y="125" class="main-name" filter="url(#neon-glow)">Rashedul Hasan Rafi</text>

  <!-- Role Title -->
  <text x="90" y="165" class="main-role">Full-Stack Web Developer</text>

  <!-- Quote -->
  <text x="90" y="210" class="quote-text">&gt; "I code, therefore I am."</text>

  <!-- Description -->
  <text x="90" y="242" class="body-desc">Passionate about solving real-world problems through programming.</text>

  <!-- Location Badge -->
  <g transform="translate(90, 268)">
    <path d="M6 0C2.69 0 0 2.69 0 6c0 5.25 6 11 6 11s6-5.75 6-11c0-3.31-2.69-6-6-6zm0 8.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#00f2fe" transform="translate(0, 2)" />
    <text x="22" y="14" class="location-text">Dhaka, Bangladesh</text>
  </g>

  <!-- RIGHT SIDE / BOTTOM: Core Focus & Technologies -->
  <text x="90" y="325" class="section-label">Core Tech &amp; Interests</text>

  <g transform="translate(90, 342)">
    <!-- JavaScript Badge -->
    <g transform="translate(0,0)">
      <rect width="120" height="40" rx="20" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" />
      <circle cx="20" cy="20" r="5" fill="#00f2fe" />
      <text x="36" y="25" class="badge-label">JavaScript</text>
    </g>

    <!-- TypeScript Badge -->
    <g transform="translate(132,0)">
      <rect width="120" height="40" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="20" cy="20" r="5" fill="#38bdf8" />
      <text x="36" y="25" class="badge-label">TypeScript</text>
    </g>

    <!-- React Badge -->
    <g transform="translate(264,0)">
      <rect width="96" height="40" rx="20" fill="#0f172a" stroke="#61dafb" stroke-width="1.5" />
      <circle cx="20" cy="20" r="5" fill="#61dafb" />
      <text x="36" y="25" class="badge-label">React</text>
    </g>

    <!-- MongoDB Badge -->
    <g transform="translate(372,0)">
      <rect width="116" height="40" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="20" cy="20" r="5" fill="#10b981" />
      <text x="36" y="25" class="badge-label">MongoDB</text>
    </g>

    <!-- Tailwind Badge -->
    <g transform="translate(500,0)">
      <rect width="130" height="40" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="20" cy="20" r="5" fill="#38bdf8" />
      <text x="36" y="25" class="badge-label">TailwindCSS</text>
    </g>

    <!-- Linux Badge -->
    <g transform="translate(642,0)">
      <rect width="90" height="40" rx="20" fill="#0f172a" stroke="#facc15" stroke-width="1.5" />
      <circle cx="20" cy="20" r="5" fill="#facc15" />
      <text x="36" y="25" class="badge-label">Linux</text>
    </g>

    <!-- Shell Scripting Badge -->
    <g transform="translate(744,0)">
      <rect width="150" height="40" rx="20" fill="#0f172a" stroke="#e100ff" stroke-width="1.5" />
      <circle cx="20" cy="20" r="5" fill="#e100ff" />
      <text x="36" y="25" class="badge-label">Shell Scripting</text>
    </g>
  </g>
</svg>
