<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #f0f6fc; }
      .handle { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 22px; fill: #58a6ff; font-weight: 600; }
      .tagline { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 24px; fill: #8b949e; }
      .location { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #8b949e; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #208838; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg-grad)" rx="12" />
  <rect width="1280" height="400" fill="url(#grid)" rx="12" />

  <!-- Accent Top Line -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent-grad)" />

  <!-- Code Graphic / Terminal Motif (Right Side) -->
  <g transform="translate(820, 110)">
    <rect width="380" height="180" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5" fill="#ff5f56" />
    <circle cx="36" cy="20" r="5" fill="#ffbd2e" />
    <circle cx="52" cy="20" r="5" fill="#27c93f" />
    <line x1="0" y1="38" x2="380" y2="38" stroke="#30363d" stroke-width="1" />
    
    <!-- Code Snippet -->
    <text x="20" y="70" font-family="Consolas, monospace" font-size="14" fill="#ff7b72">const <tspan fill="#d2a8ff">developer</tspan> = {</text>
    <text x="35" y="95" font-family="Consolas, monospace" font-size="14" fill="#79c0ff">  name: <tspan fill="#a5d6ff">'Rashedul Hasan Rafi'</tspan>,</text>
    <text x="35" y="120" font-family="Consolas, monospace" font-size="14" fill="#79c0ff">  status: <tspan fill="#a5d6ff">'Building &amp; Learning'</tspan>,</text>
    <text x="35" y="145" font-family="Consolas, monospace" font-size="14" fill="#79c0ff">  motto: <tspan fill="#a5d6ff">'I code, therefore I am.'</tspan></text>
    <text x="20" y="170" font-family="Consolas, monospace" font-size="14" fill="#ff7b72">};</text>
  </g>

  <!-- Left Content -->
  <!-- GitHub Pro Badge -->
  <g transform="translate(80, 85)">
    <rect width="60" height="22" rx="11" fill="#208838" fill-opacity="0.2" stroke="#208838" stroke-width="1" />
    <text x="30" y="15" text-anchor="middle" class="badge-text">PRO</text>
  </g>

  <!-- Name & Handle -->
  <text x="80" y="155" class="title">Rashedul Hasan Rafi</text>
  <text x="80" y="190" class="handle">@1ysand3r</text>

  <!-- Bio Quote -->
  <text x="80" y="245" class="tagline">&gt; "I code, therefore I am."</text>

  <!-- Location -->
  <g transform="translate(80, 290)">
    <!-- Map Pin Icon -->
    <path d="M6 0C2.69 0 0 2.69 0 6c0 5.25 6 11 6 11s6-5.75 6-11c0-3.31-2.69-6-6-6zm0 8.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#8b949e" transform="translate(0, 2)" />
    <text x="20" y="14" class="location">Dhaka, Bangladesh</text>
  </g>
</svg>
